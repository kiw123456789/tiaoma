<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก | เที่ยวมะ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">เที่ยว<span class="dot">มะ</span></a>
  <nav class="main-nav">
    <a href="index.html">หน้าแรก</a>
    <a href="places.html">แนะนำที่เที่ยว</a>
    <a href="articles.html">บทความ</a>
    <a href="about.html">เที่ยวกับเรา</a>
  </nav>
  <div class="header-right">
    <a href="login.html"><button class="btn-outline">เข้าสู่ระบบ</button></a>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <h2>สมัครสมาชิก</h2>
    <p class="auth-sub">สมัครสมาชิกฟรี เพื่อบันทึกที่เที่ยวโปรดของคุณ</p>

    <div class="form-success" id="regSuccess"></div>
    <div class="form-error" id="regError"></div>

    <form onsubmit="return handleRegister(event)">
      <div class="form-group">
        <label for="regName">ชื่อ-นามสกุล</label>
        <input type="text" id="regName" placeholder="กรอกชื่อของคุณ">
      </div>
      <div class="form-group">
        <label for="regEmail">อีเมล</label>
        <input type="email" id="regEmail" placeholder="example@email.com">
      </div>
      <div class="form-group">
        <label for="regPassword">รหัสผ่าน</label>
        <input type="password" id="regPassword" placeholder="อย่างน้อย 6 ตัวอักษร">
      </div>
      <div class="form-group">
        <label for="regConfirm">ยืนยันรหัสผ่าน</label>
        <input type="password" id="regConfirm" placeholder="กรอกรหัสผ่านอีกครั้ง">
      </div>
      <button type="submit" class="btn-primary">สมัครสมาชิก</button>
    </form>

    <div class="auth-switch">
      มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-col">
      <h4>เที่ยวมะ</h4>
      <a href="about.html">เกี่ยวกับเรา</a>
      <a href="articles.html">บทความท่องเที่ยว</a>
    </div>
    <div class="footer-col">
      <h4>เมนู</h4>
      <a href="index.html">หน้าแรก</a>
      <a href="places.html">แนะนำที่เที่ยว</a>
    </div>
    <div class="footer-col">
      <h4>บัญชีผู้ใช้</h4>
      <a href="register.html">สมัครสมาชิก</a>
      <a href="login.html">เข้าสู่ระบบ</a>
    </div>
  </div>
  <div class="footer-bottom">© 2026 เที่ยวมะ | เว็บไซต์แนะนำสถานที่ท่องเที่ยว</div>
</footer>

<button id="back-to-top" onclick="scrollToTop()">⬆</button>

<script src="script.js"></script>
</body>
</html>
