<!DOCTYPE html>

<section class="hero" style="min-height:200px;">

  <p>เลือกจุดหมายที่ใช่ แล้วออกเดินทางไปกับเที่ยวมะ</p>
</section>

<main>
  <div class="search-box" style="display:flex; justify-content:center; gap:10px; margin-bottom:30px; flex-wrap:wrap;">
    <input type="text" id="searchInput" placeholder="พิมพ์ชื่อสถานที่ที่ต้องการค้นหา..."

    <select id="categoryFilter" style="padding:10px 34px 10px 18px; border:1px solid #ccc; border-radius:30px; appearance:none; -webkit-appearance:none; background:#fff url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23666%22><path d=%22M7 10l5 5 5-5z%22/></svg>') no-repeat right 12px center/16px 16px;">

      <option value="ภูเขา">ภูเขา / ธรรมชาติ</option>
      <option value="ทะเล">ทะเล / เกาะ</option>
      <option value="วัด">วัด / วัฒนธรรม</option>
      <option value="ประวัติศาสตร์">ประวัติศาสตร์</option>
    </select>
  </div>

  <section class="places-grid" id="places" data-mode="all">
    <!-- เนื้อหาสถานที่ท่องเที่ยวถูกสร้างขึ้นอัตโนมัติโดย script.js จาก places-data.js -->
  </section>
</main>

    <div class="footer-col">
      <h4>เที่ยวมะ</h4>
      <a href="about.html">เกี่ยวกับเรา</a>

    </div>
    <div class="footer-col">
      <h4>เมนู</h4>
      <a href="index.html">หน้าแรก</a>
      <a href="places.html">แนะนำที่เที่ยว</a>
    </div>
    <div class="footer-col">
      <h4>บัญชีผู้ใช้</h4>
